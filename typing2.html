        // --- UTILITY FUNCTIONS ---

        function getThemeClasses() {
            return themes[state.currentTheme] || themes.dark;
        }
        
        /**
         * Clears the main app container and injects new content.
         * @param {HTMLElement} content 
         */
        function renderView(content) {
            const app = document.getElementById('app');
            const theme = getThemeClasses();
            
            // Apply main theme classes to the body
            document.body.className = `min-h-screen ${theme.bg} ${theme.text} transition-colors duration-500`;

            app.innerHTML = '';
            app.appendChild(content);
        }

        /**
         * Calculates WPM, Accuracy, and Errors based on current state.
         * @returns {{wpm: number, accuracy: number, errorCount: number}}
         */
        function calculateStats() {
            const { targetText, typedText, startTime, endTime } = state;
            
            if (!startTime || typedText.length === 0) {
                return { wpm: 0, accuracy: 100, errorCount: 0 };
            }

            const elapsedSeconds = (endTime ? endTime - startTime : Date.now() - startTime) / 1000;
            let correctChars = 0;
            
            for (let i = 0; i < typedText.length; i++) {
                if (typedText[i] === targetText[i]) {
                    correctChars++;
                }
            }

            const totalCharsTyped = typedText.length;
            const errorCount = totalCharsTyped - correctChars;
            
            // WPM calculation: (Correct Characters / 5) / (Elapsed Minutes)
            const elapsedMinutes = elapsedSeconds / 60;
            const wpm = elapsedMinutes > 0 ? Math.round((correctChars / 5) / elapsedMinutes) : 0;
            
            // Accuracy calculation: (Correct Chars / Total Chars Typed) * 100
            const accuracy = totalCharsTyped > 0 ? ((correctChars / totalCharsTyped) * 100).toFixed(1) : 100;

            return { wpm, accuracy: parseFloat(accuracy), errorCount };
        }

        // --- RENDERERS ---

        /** Renders the settings view for theme selection. */
        function renderSettings() {
            const theme = getThemeClasses();
            const container = document.createElement('div');
            container.className = `flex flex-col items-center justify-center min-h-screen ${theme.bg} ${theme.text} p-4`;
            
            // Dynamically generate theme options, including the new ones
            const themeOptionsHtml = Object.keys(themes).map(key => {
                const t = themes[key];
                const isCurrent = state.currentTheme === key;
                return `
                    <button data-theme="${key}" 
                        class="theme-select-btn w-full p-4 text-left rounded-xl shadow-lg border-2 ${isCurrent ? `${t.border} border-4` : 'border-gray-700/50'} ${t.card} transition duration-300 hover:scale-[1.02]">
                        <div class="flex items-center justify-between">
                            <span class="text-xl font-bold ${t.primary}">${t.name}</span>
                            <div class="w-6 h-6 rounded-full ${t.accentBg} ${t.accentText} border-4 border-white/50"></div>
                        </div>
                    </button>
                `;
            }).join('');


            container.innerHTML = `
                <div class="${theme.card} p-8 rounded-2xl shadow-2xl max-w-xl w-full">
                    <h1 class="text-4xl font-extrabold mb-4 ${theme.primary}">App Settings</h1>
                    <p class="mb-8 ${theme.secondary}">Select a visual theme for the application to match your vibe.</p>

                    <div class="space-y-4">
                        ${themeOptionsHtml}
                    </div>

                    <button id="back-to-menu-btn" class="mt-8 w-full py-3 ${theme.accentBg} ${theme.accentText} font-bold rounded-xl hover:opacity-90 transition duration-200 shadow-lg">
                        <span class="text-xl mr-2">←</span> Back to Main Menu
                    </button>
                </div>
            `;
            
            container.querySelector('#back-to-menu-btn').addEventListener('click', () => {
                state.currentView = 'select';
                renderApp();
            });

            container.querySelectorAll('.theme-select-btn').forEach(button => {
                button.addEventListener('click', (e) => {
                    state.currentTheme = e.currentTarget.dataset.theme;
                    renderSettings(); // Re-render settings to show active theme
                });
            });

            renderView(container);
        }

        /**
         * Renders the main level selection screen.
         */
        function renderLevelSelect() {
            const theme = getThemeClasses();
            const container = document.createElement('div');
            container.className = `flex flex-col items-center justify-center min-h-screen ${theme.bg} ${theme.text} p-4`;
            container.innerHTML = `
                <header class="w-full max-w-5xl flex justify-end p-4 absolute top-0 right-0">
                    <button id="settings-btn" class="p-2 ${theme.card} ${theme.secondary} rounded-full hover:bg-gray-700 transition duration-200 shadow-md">
                        <!-- Icon: Settings Cog -->
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m4.93 19.07 1.41-1.41"/><path d="m17.66 6.34 1.41-1.41"/><circle cx="12" cy="12" r="3"/></svg>
                    </button>
                </header>

                <h1 class="text-6xl font-extrabold mb-4 ${theme.primary}">Type With Vibe</h1>
                <p class="text-xl ${theme.secondary} mb-12">Select your typing challenge level to view all 50 stages.</p>

                <div class="grid md:grid-cols-3 gap-8 w-full max-w-5xl" id="level-buttons">
                    <!-- Buttons injected here -->
                </div>
            `;
            
            const buttonContainer = container.querySelector('#level-buttons');

            Object.keys(levelTexts).forEach(level => {
                const data = levelTexts[level];
                const div = document.createElement('div');
                div.className = `${theme.card} p-8 rounded-xl shadow-2xl border-t-4 ${theme.border} transform hover:scale-[1.03] transition duration-300 ease-in-out cursor-pointer`;
                div.innerHTML = `
                    <h2 class="text-3xl font-bold mb-3 capitalize ${theme.text}">${data.title.replace(' Vibe', '')}</h2>
                    <p class="${theme.secondary} mb-6 h-12">${data.description.substring(0, 80)}...</p>
                    <button class="w-full py-3 ${theme.accentBg} ${theme.accentText} font-bold rounded-xl hover:opacity-90 transition duration-200 shadow-lg">
                        View Stages (50)
                    </button>
                `;
                div.querySelector('button').addEventListener('click', () => {
                    state.selectedLevel = level;
                    state.currentView = 'stage_select';
                    renderApp();
                });
                buttonContainer.appendChild(div);
            });
            
            container.querySelector('#settings-btn').addEventListener('click', () => {
                state.currentView = 'settings';
                renderApp();
            });

            renderView(container);
        }

        /**
         * Renders the stage selection screen for the current level.
         */
        function renderStageSelect() {
            const theme = getThemeClasses();
            const level = state.selectedLevel;
            const levelData = levelTexts[level];

            const container = document.createElement('div');
            container.className = `min-h-screen p-4 md:p-8 ${theme.bg} ${theme.text}`;
            container.innerHTML = `
                <div class="flex justify-between items-center mb-8 max-w-6xl mx-auto">
                    <!-- Back to Level Button (TOP LEFT) -->
                    <button id="back-to-level-select" class="px-4 py-2 ${theme.card} ${theme.secondary} font-semibold rounded-xl hover:bg-gray-700/50 transition duration-200 shadow-md">
                        <span class="text-xl mr-1">←</span> Back to Levels
                    </button>
                    <!-- Header -->
                    <div class="text-center flex-1 -ml-24 md:ml-0">
                         <h1 class="text-4xl md:text-5xl font-extrabold ${theme.primary} capitalize">${levelData.title} Stages</h1>
                    </div>
                    <div><!-- Spacer --></div>
                </div>
                
                <p class="text-center ${theme.secondary} mb-8 max-w-2xl mx-auto">${levelData.description}</p>
                
                <div class="grid sm:grid-cols-2 lg:grid-cols-4 gap-4 w-full max-w-6xl mx-auto" id="stage-grid">
                    <!-- Stage buttons injected here -->
                </div>
            `;
            
            container.querySelector('#back-to-level-select').addEventListener('click', () => {
                state.currentView = 'select';
                renderApp();
            });

            const stageGrid = container.querySelector('#stage-grid');
            levelData.stages.forEach(stage => {
                const div = document.createElement('div');
                div.className = `${theme.card} p-4 rounded-xl shadow-xl border-t-4 ${theme.border} transform hover:scale-[1.02] transition duration-300 ease-in-out cursor-pointer`;
                div.innerHTML = `
                    <h2 class="text-lg font-bold mb-1 ${theme.text}">Stage ${stage.id}: ${stage.name}</h2>
                    <p class="${theme.secondary} mb-4 italic text-xs h-8 overflow-hidden">${stage.text.substring(0, 50)}...</p>
                    <button class="w-full py-2 ${theme.accentBg} ${theme.accentText} font-bold rounded-lg text-sm hover:opacity-90 transition duration-200 shadow-lg">
                        Start Stage
                    </button>
                `;
                div.querySelector('button').addEventListener('click', () => {
                    state.selectedStage = stage;
                    state.targetText = stage.text;
                    resetTest(); 
                    state.currentView = 'typing';
                    renderApp();
                });
                stageGrid.appendChild(div);
            });

            renderView(container);
        }

        /**
         * Renders the colored text display based on current typing state.
         */
        function renderTextDisplay() {
            const theme = getThemeClasses();
            const { targetText, typedText } = state;
            const textDisplayDiv = document.getElementById('text-display-content');

            if (!textDisplayDiv) return;

            // Set the cursor color dynamically based on the current theme
            document.documentElement.style.setProperty('--cursor-color', theme.cursor);


            let htmlContent = '';
            
            for (let i = 0; i < targetText.length; i++) {
                const char = targetText[i];
                let className = `${theme.secondary}`; // Upcoming
                const isCurrentChar = i === typedText.length;
                let displayChar = char === ' ' ? '\u00a0' : char; // Use non-breaking space for layout consistency

                if (i < typedText.length) {
                    // Typed:
                    if (typedText[i] === char) {
                        className = `${theme.correct}`;
                    } else {
                        // Incorrect character
                        className = `${theme.error} rounded-sm`; 
                    }
                } else if (isCurrentChar) {
                    // Current character (cursor position)
                    className = `${theme.text}`;
                }

                if (isCurrentChar && state.status !== 'finished') {
                    // Apply cursor styling and color based on theme
                    className += ' current-char';
                    const cursorStyle = document.createElement('style');
                    cursorStyle.textContent = `.current-char { border-left-color: ${theme.cursor}; }`;
                    textDisplayDiv.appendChild(cursorStyle);
                }

                htmlContent += `<span class="char-span transition-colors duration-50 ${className}">${displayChar}</span>`;
            }

            textDisplayDiv.innerHTML = htmlContent;

            // Scroll Logic to keep cursor in view
            const cursor = textDisplayDiv.querySelector('.current-char');
            if (cursor) {
                const containerRect = textDisplayDiv.getBoundingClientRect();
                const cursorRect = cursor.getBoundingClientRect();

                // Calculate vertical position relative to the container
                const relativeCursorY = cursorRect.top - containerRect.top + textDisplayDiv.scrollTop;

                const scrollThreshold = containerRect.height * 0.75; // Scroll when cursor passes 75% height

                if (relativeCursorY > scrollThreshold) {
                    // Scroll just enough to bring the cursor back to the top 25% area
                    const scrollAmount = relativeCursorY - (containerRect.height * 0.25);
                    textDisplayDiv.scrollTop = scrollAmount;
                }
            } else if (typedText.length === 0) {
                 // Reset scroll when starting a new test
                textDisplayDiv.scrollTop = 0;
            }
        }

        /**
         * Renders the typing test screen.
         */
        function renderTypingTest() {
            const theme = getThemeClasses();
            const level = state.selectedLevel;
            const stage = state.selectedStage;
            const stats = calculateStats();
            
            let statusColor = `${theme.secondary}`;
            if (state.status === 'typing') statusColor = 'text-yellow-400';
            if (state.status === 'finished') statusColor = `${theme.correct}`;

            const container = document.createElement('div');
            container.className = `min-h-screen p-4 md:p-8 ${theme.bg} ${theme.text}`;
            container.innerHTML = `
                <h1 class="text-4xl font-extrabold mb-2 text-center ${theme.primary} capitalize">${levelTexts[level].title.replace(' Vibe', '')}: ${stage.name}</h1>
                <p class="text-center ${theme.secondary} mb-8 max-w-2xl mx-auto">${levelTexts[level].description}</p>
                
                <div class="max-w-4xl mx-auto">
                    <!-- Stats Header -->
                    <div class="flex justify-between items-center mb-4 p-4 ${theme.card} rounded-lg shadow-inner">
                        <div class="text-lg font-semibold">WPM: <span id="wpm-stat" class="${theme.primary}">${stats.wpm}</span></div>
                        <div class="text-lg font-semibold">Accuracy: <span id="accuracy-stat" class="${theme.primary}">${stats.accuracy}%</span></div>
                        <div class="text-lg font-semibold">Status: <span id="status-stat" class="font-bold ${statusColor}">${state.status.toUpperCase()}</span></div>
                    </div>

                    <!-- Text Display Area -->
                    <div id="text-display-content" class="text-lg md:text-xl font-mono p-4 ${theme.card} rounded-lg shadow-xl mb-6 leading-snug border border-gray-700/50 h-[10rem] overflow-x-hidden overflow-y-scroll scrollbar-hide">
                        <!-- Text injected by renderTextDisplay -->
                    </div>
                    
                    <!-- NO KEYBOARD HERE -->

                    <div id="test-info-area" class="text-center mt-6">
                        ${state.status === 'ready' ? 
                            `<p class="text-xl ${theme.secondary} animate-pulse">Press any key to start the test...</p>` : 
                            ''
                        }
                        ${state.status === 'finished' ? 
                            `
                            <div class="mt-8 p-6 bg-green-900/50 border border-green-700 rounded-xl shadow-2xl">
                                <h3 class="text-3xl font-bold text-green-400 mb-4">Stage Complete! 🚀</h3>
                                <div class="flex justify-around items-center space-x-4 text-center">
                                    <div class="p-4 bg-green-800/70 rounded-lg flex-1 transition duration-300">
                                        <p class="text-5xl font-extrabold text-white">${stats.wpm}</p>
                                        <p class="text-sm text-green-200 mt-1">WPM</p>
                                    </div>
                                    <div class="p-4 bg-green-800/70 rounded-lg flex-1 transition duration-300">
                                        <p class="text-5xl font-extrabold text-white">${stats.accuracy}%</p>
                                        <p class="text-sm text-green-200 mt-1">Accuracy</p>
                                    </div>
                                    <div class="p-4 bg-green-800/70 rounded-lg flex-1 transition duration-300">
                                        <p class="text-5xl font-extrabold text-white">${stats.errorCount}</p>
                                        <p class="text-sm text-green-200 mt-1">Errors</p>
                                    </div>
                                </div>
                                <button id="choose-next-stage" class="mt-6 w-full py-3 ${theme.accentBg} ${theme.accentText} font-bold rounded-xl hover:opacity-90 transition duration-200 shadow-md">
                                    Choose Next Stage
                                </button>
                            </div>
                            ` : 
                            ''
                        }
                    </div>

                    <div class="flex justify-center space-x-4 mt-8">
                        <button id="change-stage-btn" class="px-6 py-3 ${theme.card} ${theme.text} font-semibold rounded-xl hover:bg-gray-700/50 transition duration-200 shadow-md">
                            Change Stage
                        </button>
                        <button id="retry-stage-btn" class="px-6 py-3 bg-red-600 text-white font-semibold rounded-xl hover:bg-red-700 transition duration-200 shadow-md">
                            Retry Stage
                        </button>
                    </div>
                </div>
            `;

            renderView(container);
            
            // Re-render text display immediately after mounting
            renderTextDisplay();

            // Attach event listeners
            document.getElementById('change-stage-btn').addEventListener('click', () => {
                state.currentView = 'stage_select';
                renderApp();
            });
            document.getElementById('retry-stage-btn').addEventListener('click', () => {
                resetTest();
                renderApp(); // Re-render to update status/text
            });

            if (state.status === 'finished') {
                document.getElementById('choose-next-stage').addEventListener('click', () => {
                    state.currentView = 'stage_select';
                    renderApp();
                });
            }
        }
        
        // --- CORE LOGIC ---
        
        /**
         * Main function to start or restart the typing test state.
         */
        function resetTest() {
            state.typedText = '';
            state.startTime = null;
            state.endTime = null;
            state.status = 'ready';
        }

        /**
         * Updates the stats section of the typing test view.
         */
        function updateStats() {
            const theme = getThemeClasses();
            const stats = calculateStats();
            const wpmEl = document.getElementById('wpm-stat');
            const accuracyEl = document.getElementById('accuracy-stat');
            const statusEl = document.getElementById('status-stat');
            
            if (wpmEl) wpmEl.textContent = stats.wpm;
            if (accuracyEl) accuracyEl.textContent = `${stats.accuracy}%`;

            if (statusEl) {
                statusEl.textContent = state.status.toUpperCase();
                statusEl.className = 'font-bold ' + (
                    state.status === 'typing' ? 'text-yellow-400' : 
                    state.status === 'finished' ? theme.correct : 
                    theme.secondary
                );
            }
            
            // If the test finished, re-render the whole test view to show the results box
            if (state.status === 'finished') {
                renderTypingTest();
            }
        }

        /**
         * Global keydown handler for typing input.
         * @param {KeyboardEvent} event 
         */
        function handleKeydown(event) {
            if (state.currentView !== 'typing' || state.status === 'finished') return;

            // Prevent default browser shortcuts when typing (e.g., F5, Ctrl+R, space scrolls)
            if (event.key !== 'F5' && event.key !== 'F12' && !event.ctrlKey && !event.altKey && !event.metaKey) {
                event.preventDefault();
            }

            const key = event.key;

            if (key === 'Backspace') {
                if (state.typedText.length > 0) {
                    state.typedText = state.typedText.slice(0, -1);
                    renderTextDisplay();
                    updateStats();
                }
            } else if (key.length === 1) {
                // 1. Start the test if it's ready
                if (state.status === 'ready') {
                    state.startTime = Date.now();
                    state.status = 'typing';
                    // Clear "Press any key to start" message
                    const infoArea = document.getElementById('test-info-area');
                    if(infoArea) infoArea.innerHTML = '';
                    updateStats(); // Update status display
                }

                // 2. Allow typing 
                if (state.typedText.length < state.targetText.length) {
                    state.typedText += key;
                    
                    // Check for completion
                    if (state.typedText.length === state.targetText.length) {
                        state.endTime = Date.now();
                        state.status = 'finished';
                        
                        // Mock saving score
                        console.log("MOCK DB: Saving score data...");
                    }
                    
                    renderTextDisplay();
                    updateStats();
                }
            }
        }

        /**
         * Router: Calls the correct renderer based on the current state view.
         */
        function renderApp() {
            switch (state.currentView) {
                case 'select':
                    renderLevelSelect();
                    break;
                case 'stage_select':
                    renderStageSelect();
                    break;
                case 'typing':
                    renderTypingTest();
                    break;
                case 'settings':
                    renderSettings();
                    break;
                default:
                    renderLevelSelect();
            }
        }

        // --- INITIALIZATION ---
        
        window.onload = () => {
            // Attach the global keydown listener once the DOM is ready
            document.addEventListener('keydown', handleKeydown);
            renderApp();
        };

    </script>
